name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      MISE_EXPERIMENTAL: "1"
      MISE_LOCKED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a84a03efc108f7d05469800fd48890c1cd34a6ad
        with:
          stable: true

      - name: Verify current checkout tap
        run: |
          # shellcheck disable=SC2016
          ruby -e 'tap = File.realpath(`brew --repo kenn-io/tap`.strip); workspace = File.realpath(ENV.fetch("GITHUB_WORKSPACE")); abort "kenn-io/tap resolves to #{tap}, expected #{workspace}" unless tap == workspace; puts "kenn-io/tap -> #{tap}"'

      - name: Check updater scripts
        run: |
          mise exec --locked -- ruby -c scripts/update-formulae.rb
          mise exec --locked -- ruby -Itest test/update_formulae_test.rb
          mise exec --locked -- ruby -c scripts/ghosthub_cask.rb
          mise exec --locked -- ruby -c scripts/update-ghosthub-cask.rb
          mise exec --locked -- ruby -Itest test/ghosthub_cask_test.rb

      - name: Check app identity verifier
        if: runner.os == 'macOS'
        run: mise exec --locked -- ruby -Itest test/verify_ghosthub_app_test.rb

      - name: Style
        run: |
          formulae=()
          for path in Formula/*.rb; do
            formulae+=("kenn-io/tap/$(basename "$path" .rb)")
          done
          brew style "${formulae[@]}"

      - name: Audit
        # These multi-platform formulae intentionally declare one version used
        # to construct every platform URL. Skip only the redundant-version
        # advisory while retaining all other strict audit methods.
        run: |
          formulae=()
          for path in Formula/*.rb; do
            formulae+=("kenn-io/tap/$(basename "$path" .rb)")
          done
          brew audit --strict --except=version --formula "${formulae[@]}"

      - name: Install and test
        run: |
          formulae=()
          for path in Formula/*.rb; do
            formulae+=("kenn-io/tap/$(basename "$path" .rb)")
          done
          for formula in "${formulae[@]}"; do
            brew install "$formula"
            brew test "$formula"
          done
